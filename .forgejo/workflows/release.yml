name: Release plugin

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  release:
    runs-on: dalamud
    env:
      PROJECT: wahventory/WahVentory.csproj
      INTERNAL: wahventory
      DALAMUD_HOME: /tmp/dalamud
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Is this a release tag?
        id: gate
        run: |
          V="${GITHUB_REF_NAME#v}"
          if echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is not a version tag, nothing to release"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.release == 'yes'
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.release == 'yes'
        with:
          dotnet-version: 10.0.x

      - name: Dalamud
        if: steps.gate.outputs.release == 'yes'
        run: |
          set -euo pipefail
          command -v unzip >/dev/null || { apt-get update -qq && apt-get install -y -qq unzip; }
          command -v jq    >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          curl -fsSL -o /tmp/dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$DALAMUD_HOME"
          unzip -oq /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        if: steps.gate.outputs.release == 'yes'
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          args=(-c Release -p:EnableWindowsTargeting=true)
          if echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            args+=(-p:Version="$V" -p:AssemblyVersion="$V" -p:FileVersion="$V")
            echo "version from tag: $V"
          else
            echo "tag $GITHUB_REF_NAME is not a version, keeping the csproj value"
          fi
          dotnet build "$PROJECT" "${args[@]}"
          echo "OUT=$(dirname "$PROJECT")/bin/Release/$INTERNAL" >> "$GITHUB_ENV"

      - name: Attach assets
        if: steps.gate.outputs.release == 'yes'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: token $TOKEN")
          test -f "$OUT/latest.zip"

          ID=$(curl -sS "${auth[@]}" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$ID" ]; then
            ID=$(curl -sS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
                   -d "$(jq -n --arg t "$TAG" '{tag_name:$t, name:$t}')" \
                   "$API/releases" | jq -r '.id // empty')
          fi
          [ -n "$ID" ] || { echo "::error::no release for $TAG"; exit 1; }

          existing=$(curl -sS "${auth[@]}" "$API/releases/$ID/assets")
          for n in latest.zip "$INTERNAL.json"; do
            old=$(echo "$existing" | jq -r --arg n "$n" '.[] | select(.name==$n) | .id')
            [ -n "$old" ] && curl -sS -X DELETE "${auth[@]}" "$API/releases/$ID/assets/$old"
          done

          curl -sS --fail-with-body -X POST "${auth[@]}" \
            -F "attachment=@$OUT/latest.zip" "$API/releases/$ID/assets?name=latest.zip" > /dev/null
          curl -sS --fail-with-body -X POST "${auth[@]}" \
            -F "attachment=@$OUT/$INTERNAL.json" "$API/releases/$ID/assets?name=$INTERNAL.json" > /dev/null
          echo "$TAG: uploaded latest.zip + $INTERNAL.json"
